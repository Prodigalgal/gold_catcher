apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gold-catcher-https
spec:
  hostnames: [gold.mnnu.eu.org]
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mnnu-gateway, namespace: gateway-system, sectionName: https}
  rules:
    - matches: [{path: {type: PathPrefix, value: /api}}]
      backendRefs: [{group: '', kind: Service, name: gold-catcher-server, port: 8080, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: '', kind: Service, name: gold-catcher-web, port: 8080, weight: 1}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gold-catcher-http-redirect
spec:
  hostnames: [gold.mnnu.eu.org]
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: mnnu-gateway, namespace: gateway-system, sectionName: http}
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
