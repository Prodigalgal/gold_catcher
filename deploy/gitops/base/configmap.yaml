apiVersion: v1
kind: ConfigMap
metadata:
  name: gold-catcher-config
data:
  GOLD_APPLICATION_MODE: INTERNAL_SIMULATION_ALPHA
  GOLD_ANY2API_BASE_URL: http://any2api-server.any2api.svc.cluster.local:8080
  GOLD_DB_URL: jdbc:postgresql://gold-catcher-postgres:5432/gold_catcher
  GOLD_DB_USERNAME: gold_catcher
  GOLD_MARKET_ENABLED: "true"
  GOLD_NEWS_ENABLED: "true"
  GOLD_DRIVERS_ENABLED: "true"
  GOLD_RESEARCH_AUTOMATIC: "false"
  GOLD_AI_DISABLED_PROVIDERS: qwen
  GOLD_AI_JSON_TEXT_PROVIDERS: mimo,glm
  GOLD_COMPRESSION_ENABLED: "true"
  GOLD_COMPRESSION_CHUNKS_PER_PASS: "2"
  GOLD_MARKET_ARCHIVE_RETENTION_DAYS: "3"
  GOLD_AUTH_COOKIE_SECURE: "true"
  GOLD_AUTH_POW_BITS: "18"
  GOLD_GATE_ENABLED: "true"
  GOLD_GATE_HTTP_URL: https://api.gateio.ws/api/v4
  GOLD_GATE_WS_URL: wss://fx-ws.gateio.ws/v4/ws/usdt
  GOLD_NEWS_POLL_SECONDS: "30"
  GOLD_EXECUTION_DELAY_MS: "250"
  TZ: UTC
