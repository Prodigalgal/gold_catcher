apiVersion: v1
kind: Service
metadata:
  name: gold-catcher-postgres
spec:
  clusterIP: None
  selector: {app: gold-catcher-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gold-catcher-postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  serviceName: gold-catcher-postgres
  replicas: 0
  selector:
    matchLabels: {app: gold-catcher-postgres}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels: {app: gold-catcher-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-bookworm
          env:
            - {name: POSTGRES_DB, value: gold_catcher}
            - {name: POSTGRES_USER, value: gold_catcher}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: gold-catcher-runtime, key: GOLD_DB_PASSWORD}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: database, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [pg_isready, -U, gold_catcher, -d, gold_catcher]}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
  volumeClaimTemplates:
    - metadata:
        name: database
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests: {storage: 10Gi}
