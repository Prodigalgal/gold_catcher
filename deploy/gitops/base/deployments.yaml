apiVersion: apps/v1
kind: Deployment
metadata:
  name: gold-catcher-server
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gold-catcher-server
  template:
    metadata:
      labels:
        app: gold-catcher-server
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gold-catcher-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: gold-catcher-server:unreleased
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gold-catcher-config
            - secretRef:
                name: gold-catcher-runtime
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gold-catcher-web
spec:
  replicas: 0
  selector:
    matchLabels:
      app: gold-catcher-web
  template:
    metadata:
      labels:
        app: gold-catcher-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gold-catcher-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: gold-catcher-web:unreleased
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
