server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/json,text/csv,text/plain
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${GOLD_AUTH_COOKIE_SECURE:false}
        same-site: strict
        path: /
spring:
  application:
    name: gold-catcher
  datasource:
    url: ${GOLD_DB_URL:jdbc:h2:file:./data/gold-catcher;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${GOLD_DB_USERNAME:sa}
    password: ${GOLD_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 6
  flyway:
    enabled: true
  data:
    redis:
      host: ${GOLD_CACHE_REDIS_HOST:127.0.0.1}
      port: ${GOLD_CACHE_REDIS_PORT:6379}
      password: ${GOLD_CACHE_REDIS_PASSWORD:}
      connect-timeout: 200ms
      timeout: 200ms
  task:
    scheduling:
      pool:
        size: 6
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
gold:
  source-commit: ${GOLD_SOURCE_COMMIT:development}
  auth:
    username: ${GOLD_AUTH_USERNAME:}
    password: ${GOLD_AUTH_PASSWORD:}
    pow-bits: ${GOLD_AUTH_POW_BITS:18}
