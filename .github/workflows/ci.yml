name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify Java contracts and package
        working-directory: backend
        run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        env:
          VITE_SOURCE_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build && npm run build:prototype
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Check release mutations and manifests
        run: |
          python3 scripts/check_versions.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          kubectl kustomize deploy/gitops/oracle > rendered.yaml
          python3 scripts/check_manifests.py rendered.yaml
