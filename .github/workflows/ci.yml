name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify Java contracts and package
        working-directory: backend
        run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
      - name: Verify PAT and official MCP client compatibility without model calls
        env:
          GOLD_MARKET_ENABLED: 'false'
          GOLD_NEWS_ENABLED: 'false'
          GOLD_SUPPLEMENTAL_ENABLED: 'false'
          GOLD_DRIVERS_ENABLED: 'false'
          GOLD_COMPRESSION_ENABLED: 'false'
          GOLD_SOURCE_PROXY_ENABLED: 'false'
          GOLD_RESEARCH_AUTOMATIC: 'false'
          GOLD_SMOKE_USERNAME: mcp-ci
          GOLD_SMOKE_PASSWORD: ci-local-acceptance-only
        run: |
          python3 -m venv "$RUNNER_TEMP/gold-mcp-sdk"
          "$RUNNER_TEMP/gold-mcp-sdk/bin/pip" install -r scripts/requirements-mcp-test.txt
          jar_path=$(find backend/build/libs -maxdepth 1 -name 'gold-catcher-server-*.jar' ! -name '*-plain.jar' -print -quit)
          test -n "$jar_path"
          java -jar "$jar_path" --server.address=127.0.0.1 --server.port=18084 \
            --gold.auth.username="$GOLD_SMOKE_USERNAME" --gold.auth.password="$GOLD_SMOKE_PASSWORD" --gold.auth.pow-bits=8 \
            '--spring.datasource.url=jdbc:h2:mem:pat-ci;MODE=PostgreSQL;DB_CLOSE_DELAY=-1' > "$RUNNER_TEMP/gold-mcp-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18084/actuator/health/readiness > /dev/null; then ready=true; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = true
          python3 scripts/verify_external_access.py --base-url http://127.0.0.1:18084
          "$RUNNER_TEMP/gold-mcp-sdk/bin/python" scripts/verify_mcp_sdk.py --base-url http://127.0.0.1:18084 --stdio
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        env:
          VITE_SOURCE_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build && npm run build:prototype
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Check release mutations and manifests
        run: |
          python3 scripts/check_versions.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          kubectl kustomize deploy/gitops/oracle > rendered.yaml
          python3 scripts/check_manifests.py rendered.yaml
